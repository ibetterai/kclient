<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title><%- title -%></title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <link href="public/css/theme.css" rel="stylesheet">
    <link href="public/css/kclient.css" rel="stylesheet">
    <!-- theme.js runs synchronously in head so data-theme is set before first paint -->
    <script src="public/js/theme.js"></script>
    <script src="audio/socket.io/socket.io.js"></script>
  </head>
  <body>
    <!--KasmVNC Iframe-->
    <iframe class="vnc" src="vnc/index.html?autoconnect=1&resize=remote&clipboard_up=true&clipboard_down=true&clipboard_seamless=true&show_control_bar=true<% if(path){ %><%- path -%><% } %>"></iframe>
    <!--LSIO Function Bar-->
    <div id="lsbar">
      <img class="icons" id="fileButton" title="File Manager" data-i18n-title="sidebar.fileManager" src="public/css/files.svg" onclick="toggle('#files')"/>
      <img class="icons" id="audioButton" title="Enable Audio" data-i18n-title="sidebar.enableAudio" src="public/css/speaker.svg" onclick="audio()"/>
      <img class="icons" id="micButton" title="Enable Microphone" data-i18n-title="sidebar.enableMic" src="public/css/mic.svg" onclick="mic()"/>
    </div>
    <!--File Browser-->
    <div id="files">
      <!-- locals.lang (ADR 0003): allowlisted 'zh_CN'|'en' from index.js, or undefined
           when a stock/base-image index.js renders this template — then the files frame
           falls back to the parent-frame ?lang= tier in i18n.js. -->
      <iframe id="files_frame" name="files_frame" src="files<% if (locals.lang) { %>?lang=<%= locals.lang %><% } %>" frameborder="0"></iframe>
      <div class="close" onclick="closeToggle('#files')"></div>
    </div>
    <!--Main logic-->
    <script src="public/js/jquery.min.js"></script>
    <script src="public/js/i18n.js"></script>
    <script src="public/js/kclient.js"></script>
  </body>
</html>
